<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

<body>
  <header><h1>Voilà.</h1><span id="connection" role="status" aria-live="polite" aria-atomic="true"></span></header>

    <h2 id="stage" class="visually-hidden" tabindex="-1"></h2>
    <p id="caption" aria-hidden="true"></p>
    <section id="actions" aria-labelledby="stage"></section>
    <div id="errors" role="alert" aria-live="assertive" aria-atomic="true"></div>

      <button id="repeat" class="secondary" type="button"></button>
      <button id="stop" class="secondary" type="button" hidden></button>
      <button id="talk" type="button" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="2" width="8" height="13" rx="4"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3M8 22h8"/></svg>
        <span id="mic-label" aria-hidden="true"></span>
      </button>
      <span id="elapsed" aria-hidden="true" hidden></span>
    </div>
    <details id="feed" hidden><summary>Debug</summary><ul id="feed-items"></ul></details>
  </main>
  <script type="module" src="/src/entry.ts"></script>
</body>
