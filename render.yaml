services:
  - type: web
    name: voila
    runtime: node
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm -r build
    startCommand: node apps/server/dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: GLADIA_API_KEY
        sync: false
      - key: HAI_API_KEY
        sync: false
      - key: LINKUP_API_KEY
        sync: false
      - key: INTERNAL_CALLBACK_TOKEN
        generateValue: true
      - key: SHUTTLE_PUBLIC_URL
        sync: false
      - key: VOILA_SCENARIO
        sync: false
      - key: TRUST_PROXY
        value: '1'
  - type: web
    name: voila-shuttle
    runtime: node
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm -r build
    startCommand: node apps/shuttle-clone/dist/index.js
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: SHUTTLE_PUBLIC_URL
        sync: false
      - key: SERVER_PUBLIC_URL
        sync: false
      - key: INTERNAL_CALLBACK_TOKEN
        fromService:
          type: web
          name: voila
          envVarKey: INTERNAL_CALLBACK_TOKEN
